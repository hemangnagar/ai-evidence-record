name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Acceptance run
        run: |
          aiev run-demo
          aiev verify
          if aiev exceptions; then echo "expected the planted exceptions"; exit 1; fi
          aiev datasheet --out demo/datasheet.html
          aiev workbench --out demo/workbench.html
          aiev verify --manifest demo/manifest.json
          aiev tamper --seq 16 --field payload.value --set Migraine
          if aiev verify; then echo "expected a broken chain"; exit 1; fi
