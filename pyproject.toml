[project]
name = "aievidence"
version = "0.1.0"
description = "AI Evidence Record: a tamper-evident ledger of what AI did to a clinical record, and the datasheet an inspector would ask for."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hemang Nagar" }]
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "rich>=13",
  "jinja2>=3.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
pdf = ["weasyprint>=60"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
aiev = "aievidence.cli:main"

[project.urls]
Homepage = "https://github.com/hemangnagar/ai-evidence-record"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aievidence*"]

[tool.setuptools.package-data]
aievidence = ["profiles/*.yaml", "templates/*.html"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
